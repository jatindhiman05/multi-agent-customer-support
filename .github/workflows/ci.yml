name: CI

on:
  push:
    branches:
      - main
      - feat/structured-support-ui

  pull_request:
    branches:
      - main

jobs:
  # ===================================================================
  # BACKEND
  # ===================================================================

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18

        env:
          POSTGRES_DB: customer_support
          POSTGRES_USER: customer_support_app
          POSTGRES_PASSWORD: ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U customer_support_app -d customer_support"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://customer_support_app:ci_password@localhost:5432/customer_support

      # CI-only secret. This is not a production credential.
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-testing

      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CHAT_PROCESSING_LEASE_SECONDS: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backend imports
        run: |
          python -m compileall -q src scripts

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Test payment and refund repositories
        run: |
          python -m scripts.test_payment_refund_repositories

      - name: Test payment row locking
        run: |
          python -m scripts.test_payment_row_lock

      - name: Test return repository
        run: |
          python -m scripts.test_return_repository

      - name: Test return service
        run: |
          python -m scripts.test_return_service

      - name: Test return window
        run: |
          python -m scripts.test_return_window

  # ===================================================================
  # FRONTEND
  # ===================================================================

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        env:
          # Build-time placeholder only.
          # No production backend is contacted by CI.
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build